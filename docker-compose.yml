services:
  chessai:
    build: .
    image: chessai:latest
    container_name: chessai
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - chessai-checkpoints:/app/checkpoints
      - chessai-data:/app/data
      - chessai-models:/app/models
    restart: unless-stopped

volumes:
  chessai-checkpoints:
  chessai-data:
  chessai-models:
