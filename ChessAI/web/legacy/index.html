<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChessAI — Crimson & Ivory</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">♞</span>
        <h1 class="brand-title">CHESS<span class="brand-accent">AI</span></h1>
      </div>
      <div class="header-controls">
        <button id="btn-new-game" class="btn btn-ghost" title="New game">⟳ New Game</button>
        <button id="btn-flip" class="btn btn-ghost" title="Flip board">⇅ Flip</button>
        <button id="btn-hint" class="btn btn-ghost" title="Show a hint (needs engine)">✧ Hint</button>
        <button id="btn-pause" class="btn btn-ghost" title="Pause clocks">❚❚ Pause</button>
      </div>
    </header>

    <div class="time-controls">
      <button class="tc-btn" data-time="bullet">Bullet</button>
      <button class="tc-btn" data-time="blitz">Blitz</button>
      <button class="tc-btn" data-time="rapid">Rapid</button>
      <button class="tc-btn" data-time="custom">Custom</button>
      <span class="tc-value" id="tc-value">10:00</span>
    </div>

    <main class="layout">
      <!-- Left: the board -->
      <section class="board-wrap">
        <div class="player-bar player-black">
          <div class="player-info">
            <span class="avatar avatar-black">♚</span>
            <div class="player-meta">
              <span class="player-name" id="black-name">Black Player</span>
              <span class="captured" id="black-captured"></span>
            </div>
          </div>
          <div class="clock" id="clock-black">10:00</div>
        </div>

        <div class="board-frame">
          <div class="eval-wrap">
            <div class="eval-bar" id="eval-bar">
              <div class="eval-fill-white" id="eval-fill-white"></div>
            </div>
            <div class="eval-label" id="eval-label">+0.0</div>
          </div>
          <div id="board" class="board"></div>
        </div>

        <div class="player-bar player-white">
          <div class="player-info">
            <span class="avatar avatar-white">♔</span>
            <div class="player-meta">
              <span class="player-name" id="white-name">White Player</span>
              <span class="captured" id="white-captured"></span>
            </div>
          </div>
          <div class="clock" id="clock-white">10:00</div>
        </div>

        <div class="game-message" id="game-message"></div>
      </section>

      <!-- Right: sidebar -->
      <aside class="sidebar">
        <div class="panel game-info">
          <h2>Game</h2>
          <div class="mode-select">
            <button class="mode-btn active" data-mode="hvh" title="Human vs Human">Human vs Human</button>
            <button class="mode-btn" data-mode="hvai" title="Human vs AI">Human vs AI</button>
            <button class="mode-btn" data-mode="aiai" title="AI vs AI">AI vs AI</button>
          </div>
          <div class="status" id="status">White to move</div>
        </div>

        <div class="panel move-history">
          <div class="panel-head">
            <h2>Moves</h2>
            <div class="nav-buttons">
              <button id="nav-start" class="nav-btn" title="Go to start">|◀</button>
              <button id="nav-prev" class="nav-btn" title="Previous move">◀</button>
              <button id="nav-next" class="nav-btn" title="Next move">▶</button>
              <button id="nav-end" class="nav-btn" title="Go to end">▶|</button>
            </div>
          </div>
          <ol id="move-list" class="move-list"></ol>
        </div>

        <div class="panel controls">
          <h2>Controls</h2>
          <div class="controls-grid">
            <button id="btn-undo" class="btn">Undo</button>
            <button id="btn-redo" class="btn">Redo</button>
            <button id="btn-restart" class="btn">Restart</button>
            <button id="btn-resign" class="btn btn-danger">Resign</button>
          </div>
          <div class="controls-grid" style="margin-top: 8px;">
            <button id="btn-clear-marks" class="btn" title="Remove analysis marks">Clear marks</button>
          </div>
        </div>

        <div class="panel settings">
          <h2>Settings</h2>
          <div class="settings-list">
            <div class="setting-row">
              <label for="opt-autoqueen">Auto-queen</label>
              <span class="switch" id="opt-autoqueen" role="switch" tabindex="0"></span>
            </div>
            <div class="setting-row">
              <label for="opt-coords">Show coordinates</label>
              <span class="switch on" id="opt-coords" role="switch" tabindex="0"></span>
            </div>
            <div class="setting-row">
              <label for="opt-sound">Sound</label>
              <span class="switch" id="opt-sound" role="switch" tabindex="0"></span>
            </div>
            <div class="setting-row" style="flex-direction: column; align-items: stretch; gap: 8px;">
              <span style="color: var(--text-dim); font-size: 13px;">Board theme</span>
              <div class="theme-select" id="theme-select"></div>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="promotion-overlay hidden" id="promotion-overlay">
    <div class="promotion-dialog">
      <h3>Promote to</h3>
      <div class="promotion-choices" id="promotion-choices"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="js/chess.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
